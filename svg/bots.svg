<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2c2c"/><stop offset="1" stop-color="#141414"/></linearGradient>
<linearGradient id="acc" gradientUnits="userSpaceOnUse" x1="20" y1="30" x2="108" y2="98"><stop offset="0" stop-color="#e22828"/><stop offset="1" stop-color="#ff8c2f"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#f15a2c" stop-opacity=".38"/><stop offset="1" stop-color="#f15a2c" stop-opacity="0"/></radialGradient>
</defs>
<style>
*{transform-box:fill-box;transform-origin:center}
.s{fill:none;stroke:url(#acc);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.f{fill:url(#acc)}
.glow{animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{opacity:.45}}

.eye{animation:blink 4s infinite}
.ant{animation:ant 1.6s ease-in-out infinite}
@keyframes blink{0%,44%,52%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
@keyframes ant{50%{fill:#ffe2cc;transform:scale(1.35)}}

</style>
<rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
<rect class="glow" x="4" y="4" width="120" height="120" rx="28" fill="url(#glow)"/>
<rect x="5" y="5" width="118" height="118" rx="27" fill="none" stroke="#f15a2c" stroke-opacity=".4" stroke-width="2"/>

<path class="s" d="M64 46 V34"/>
<circle class="f ant" cx="64" cy="29" r="5.5"/>
<rect class="s" x="34" y="46" width="60" height="46" rx="13"/>
<path class="s" d="M26 62 V76 M102 62 V76"/>
<ellipse class="f eye" cx="52" cy="65" rx="5.5" ry="7"/>
<ellipse class="f eye" cx="76" cy="65" rx="5.5" ry="7"/>
<path class="s" d="M55 81 H73" stroke-width="5"/>

</svg>
