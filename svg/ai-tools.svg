<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#283246"/><stop offset="1" stop-color="#111726"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#a78bfa" stop-opacity=".38"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
</defs>
<style>
*{transform-box:fill-box;transform-origin:center}
.s{fill:none;stroke:#a78bfa;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.f{fill:#a78bfa}
.glow{animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{opacity:.45}}

.big{animation:pulse 3s ease-in-out infinite}
.tw{animation:tw 2.4s ease-in-out infinite}
.tw2{animation-delay:1.2s}
@keyframes pulse{50%{transform:scale(.82) rotate(20deg)}}
@keyframes tw{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1);opacity:1}}

</style>
<rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
<rect class="glow" x="4" y="4" width="120" height="120" rx="28" fill="url(#glow)"/>
<rect x="5" y="5" width="118" height="118" rx="27" fill="none" stroke="#a78bfa" stroke-opacity=".4" stroke-width="2"/>

<path class="f big" d="M60 36 C63.2 58.4 69.6 64.8 92 68 C69.6 71.2 63.2 77.6 60 100 C56.8 77.6 50.4 71.2 28 68 C50.4 64.8 56.8 58.4 60 36Z"/>
<path class="f tw" d="M92 26 C93.2 34.4 95.6 36.8 104 38 C95.6 39.2 93.2 41.6 92 50 C90.8 41.6 88.4 39.2 80 38 C88.4 36.8 90.8 34.4 92 26Z" fill="#ede9fe"/>
<path class="f tw tw2" d="M96 84 C96.8 89.6 98.4 91.2 104 92 C98.4 92.8 96.8 94.4 96 100 C95.2 94.4 93.6 92.8 88 92 C93.6 91.2 95.2 89.6 96 84Z"/>

</svg>
